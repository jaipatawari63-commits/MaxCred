name: MaxCred CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate demo dataset
        run: python3 scripts/validate_demo_data.py
      - name: Validate JavaScript syntax
        run: |
          node --check data/demo-cards.js
          node --check app/maxcred-engine.js
      - name: Validate website entry point
        run: test -f app/index.html
