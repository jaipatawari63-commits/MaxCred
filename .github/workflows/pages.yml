name: MaxCred Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate demo dataset
        run: python3 scripts/validate_demo_data.py
      - name: Validate JavaScript syntax
        run: |
          node --check data/demo-cards.js
          node --check app/maxcred-engine.js
      - name: Validate website entry point
        run: test -f app/index.html

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          rm -rf dist
          mkdir -p dist/data
          cp app/index.html dist/index.html
          cp data/demo-cards.js dist/data/demo-cards.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
